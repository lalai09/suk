<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku Blue</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%232563eb'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f0e8;
  --bg-dot:#e8e0d4;
  --surface:#ffffff;
  --surface2:#faf7f2;
  --ink:#1a1a1a;
  --ink2:#5c5346;
  --ink3:#9a9080;
  --primary:#3b82f6;
  --primary2:#2563eb;
  --primary-soft:#dbeafe;
  --yellow:#fde047;
  --yellow2:#facc15;
  --pink:#fb7185;
  --pink-bg:#fda4af;
  --cyan:#67e8f9;
  --mint:#6ee7b7;
  --orange:#fdba74;
  --purple:#c4b5fd;
  --danger:#ef4444;
  --border:#1a1a1a;
  --shadow:4px 4px 0 #1a1a1a;
  --shadow-lg:6px 6px 0 #1a1a1a;
  --radius:20px;
  --board-bg:#fff;
  --cell-line:#e8e0d4;
  --cell-block:#1a1a1a;
  --cell-fixed:#1a1a1a;
  --cell-user:#2563eb;
  --cell-bad:#ef4444;
  --cell-peer:#eff6ff;
  --cell-same:#fef9c3;
  --cell-sel:#dbeafe;
  --cell-sel-ring:#3b82f6;
}
[data-theme=dark]{
  --bg:#1c1917;
  --bg-dot:#292524;
  --surface:#292524;
  --surface2:#1c1917;
  --ink:#fafaf9;
  --ink2:#a8a29e;
  --ink3:#78716c;
  --primary:#60a5fa;
  --primary2:#3b82f6;
  --primary-soft:#1e3a5f;
  --yellow:#facc15;
  --yellow2:#eab308;
  --pink:#fb7185;
  --cyan:#22d3ee;
  --mint:#34d399;
  --orange:#fb923c;
  --purple:#a78bfa;
  --border:#fafaf9;
  --shadow:4px 4px 0 #000;
  --shadow-lg:6px 6px 0 #000;
  --board-bg:#292524;
  --cell-line:#44403c;
  --cell-block:#fafaf9;
  --cell-fixed:#fafaf9;
  --cell-user:#60a5fa;
  --cell-peer:#1e3a5f;
  --cell-same:#422006;
  --cell-sel:#1e3a5f;
  --cell-sel-ring:#60a5fa;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  display:flex;flex-direction:column;height:100dvh;
  font-family:'Fredoka',system-ui,'Segoe UI',sans-serif;font-weight:600;
  color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(var(--bg-dot) 1.2px, transparent 1.2px);
  background-size:18px 18px;
  transition:background-color .3s,color .3s;
  -webkit-tap-highlight-color:transparent;
}
.bgd{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

header{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  background:var(--surface);
  border-bottom:3px solid var(--border);
  z-index:30;position:relative;
}
header b{flex:1;font-size:18px;font-weight:700}
body.home header{display:none}

.page{
  flex:1;min-height:0;width:100%;max-width:960px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:16px 16px 18px;
  overflow-y:auto;scrollbar-width:none;
  position:relative;z-index:1;
  animation:fadeUp .3s ease;
}
.page::-webkit-scrollbar{display:none}

.ib{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:50%;
  background:var(--surface);color:var(--ink);
  border:3px solid var(--border);
  box-shadow:3px 3px 0 var(--border);
  font-size:17px;cursor:pointer;text-decoration:none;
  transition:.12s;flex:none;
}
.ib:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--border)}
.ib:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}

.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 14px 5px 5px;
  background:var(--surface);color:var(--ink);
  border:3px solid var(--border);border-radius:999px;
  box-shadow:3px 3px 0 var(--border);
  text-decoration:none;font-weight:700;font-size:13px;transition:.12s;
}
.pill:hover{transform:translate(-1px,-1px)}
.pill.y{background:var(--yellow);padding:6px 16px}
.sep{width:2px;height:14px;background:var(--border);opacity:.25}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:3px solid var(--border);border-radius:14px;
  padding:11px 20px;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:14px;font-family:inherit;
  cursor:pointer;text-decoration:none;
  box-shadow:3px 3px 0 var(--border);transition:.12s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--border)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}

.card{
  background:var(--surface);color:var(--ink);
  border:3px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);
}

.inp{
  width:100%;padding:12px 14px;margin:6px 0 12px;
  border:3px solid var(--border);border-radius:14px;
  background:var(--surface);color:var(--ink);font:inherit;outline:none;
}
.inp:focus{box-shadow:0 0 0 3px var(--primary-soft)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chips button{
  border:3px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 14px;cursor:pointer;
  font:inherit;font-weight:700;font-size:13px;
  box-shadow:2px 2px 0 var(--border);transition:.12s;
}
.chips button.on{background:var(--yellow);color:var(--ink)}

.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.auth{max-width:400px;margin:16px auto}

.av{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;
  background:var(--primary-soft);border:2px solid var(--border);font-size:16px;flex:none;
}
.av.big{width:72px;height:72px;font-size:36px;border:3px solid var(--border)}

/* HOME */
.banner{
  position:relative;width:100%;max-width:700px;margin:6px auto 0;
  padding:28px 20px 22px;text-align:center;
  background:var(--yellow);
  border:3px solid var(--border);border-radius:24px;
  box-shadow:var(--shadow-lg);
}
.bt{position:absolute;top:-12px;right:12px;display:flex;gap:8px}
.bl{display:flex;align-items:center;justify-content:center;gap:14px}
.bl .logo{
  width:56px;height:56px;border-radius:16px;
  background:var(--cyan);border:3px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:var(--ink);
  box-shadow:3px 3px 0 var(--border);flex:none;
}
.bl h1{font-size:clamp(30px,7vw,48px);margin:0;letter-spacing:-1px;font-weight:800;color:var(--ink)}
.bl h1 span{color:var(--primary2)}
.banner p{margin:8px 0 0;font-weight:500;color:var(--ink2);font-size:14px}

.pills{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:16px auto;flex:none}

.menu{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:14px;width:100%;max-width:700px;margin:0 auto;flex:1;min-height:0;
}
.mc{
  position:relative;display:flex;flex-direction:column;gap:4px;
  padding:18px 16px;min-height:0;
  border:3px solid var(--border);border-radius:20px;
  color:var(--ink);text-decoration:none;
  box-shadow:var(--shadow-lg);transition:.15s;overflow:hidden;
}
.mc:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--border)}
.mc:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--border)}
.mc .ci{
  display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:50%;
  background:#fff;border:3px solid var(--border);
  font-size:24px;margin-bottom:auto;box-shadow:2px 2px 0 rgba(0,0,0,.1);
}
.mc b{font-size:17px;font-weight:800;line-height:1.2}
.mc small{font-size:12px;opacity:.7;font-weight:500}
.mc .ar{
  position:absolute;right:14px;bottom:14px;
  width:32px;height:32px;border-radius:50%;
  background:#fff;border:3px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
}
.mc::after{display:none}
.c1{background:var(--cyan)}.c2{background:var(--yellow)}.c3{background:#fff}.c4{background:var(--purple)}

.dock{display:flex;justify-content:center;gap:12px;margin:16px 0 0;flex:none}

.chip{
  position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom));
  padding:11px 18px;
  background:var(--yellow);color:var(--ink);
  border:3px solid var(--border);border-radius:999px;
  box-shadow:var(--shadow);font-weight:700;font-size:13px;
  text-decoration:none;z-index:40;animation:scaleIn .35s;
}

/* GAME */
.page.play-pg{overflow:hidden;padding:8px 12px 10px;max-width:960px}
.page.play-pg .muted{display:none}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:20px;align-items:start;flex:1;min-height:0;width:100%}
.page.play-pg .game{height:100%;align-content:start}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stats{display:flex;gap:14px;font-weight:700;font-size:14px}
.stats b{font-variant-numeric:tabular-nums}

.board{
  display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;
  width:min(100%,calc(100dvh - 155px));max-width:480px;margin:0 auto;
  border:4px solid var(--border);border-radius:16px;overflow:hidden;
  background:var(--board-bg);box-shadow:var(--shadow-lg);user-select:none;
}
.page.play-pg .board{width:min(100%,calc(100dvh - 160px));max-width:min(480px,calc(100dvh - 160px))}

.c{
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(16px,4.4vw,26px);font-weight:700;
  border:1px solid var(--cell-line);cursor:pointer;
  transition:background .12s;min-width:0;
}
.c.br{border-right:3px solid var(--border)}.c.bb{border-bottom:3px solid var(--border)}
.c.fx{font-weight:800;color:var(--cell-fixed)}
.c.usr{color:var(--cell-user)}
.c.bad{color:var(--cell-bad);background:color-mix(in srgb,var(--danger) 15%,transparent)}
.c.pr{background:var(--cell-peer)}.c.sm{background:var(--cell-same)}
.c.sel{background:var(--cell-sel);box-shadow:inset 0 0 0 3px var(--cell-sel-ring);z-index:1}

.nt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:clamp(6px,1.4vw,10px);opacity:.7;font-weight:600}
.nt i{font-style:normal;display:flex;align-items:center;justify-content:center}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button,.pad button{
  border:3px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:14px;padding:11px 4px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:700;
  box-shadow:3px 3px 0 var(--border);transition:.1s;
}
.tools button:active,.pad button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}
.tools button.on{background:var(--yellow)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;max-width:240px}
.pad button{font-size:22px;aspect-ratio:1.2}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* LISTS */
.list{display:flex;flex-direction:column;gap:8px}
.row-l{
  display:grid;grid-template-columns:40px 36px 1fr 72px 64px 110px;
  align-items:center;gap:8px;padding:11px 14px;
  background:var(--surface);color:var(--ink);
  border:3px solid var(--border);border-radius:16px;
  box-shadow:3px 3px 0 var(--border);animation:fadeUp .25s;
}
.row-l.me{outline:3px solid var(--yellow)}
.rk{font-size:18px;font-weight:800;text-align:center}
.pt{font-weight:800;color:var(--primary)}
.sm2{font-size:12px;opacity:.7}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.top1{background:linear-gradient(90deg,#fde047,var(--surface))}
.top2{background:linear-gradient(90deg,#e2e8f0,var(--surface))}
.top3{background:linear-gradient(90deg,#fdba74,var(--surface))}
.top1,.top2,.top3{color:var(--ink)}

.mine{
  padding:11px 16px;border-radius:14px;
  background:var(--yellow);color:var(--ink);
  border:3px solid var(--border);box-shadow:3px 3px 0 var(--border);
  margin:10px 0 14px;font-weight:700;font-size:14px;
}
.warn{
  padding:12px 16px;border-radius:14px;
  background:#fef3c7;color:#78350f;
  border:3px solid var(--border);margin-bottom:14px;font-size:13px;
}
.hist{grid-template-columns:1.4fr 1fr .55fr 1.2fr .65fr}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat{text-align:center;padding:16px 12px !important}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--primary)}
.stat span{opacity:.7;font-size:12px}
.prof{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.prof h1{margin:0;font-size:22px;font-weight:800}
.ach{display:flex;gap:8px;flex-wrap:wrap}
.ach div{
  padding:8px 14px;border-radius:14px;
  border:3px solid var(--border);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--border);
}
.ach .off{opacity:.35;filter:grayscale(1)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:2px dashed var(--cell-line)}
.sw:last-child{border:0}
.sw input{width:20px;height:20px;accent-color:var(--primary)}

.modal{
  position:fixed;inset:0;background:rgba(26,26,26,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:50;animation:fadeUp .2s;padding:20px;
}
.modal .card{max-width:340px;width:100%;text-align:center;animation:scaleIn .3s}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 18px;text-align:left;margin:12px 0;font-size:14px}
.kv b{color:var(--primary);font-weight:800}

#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  background:var(--yellow);color:var(--ink);
  border:3px solid var(--border);box-shadow:3px 3px 0 var(--border);
  padding:10px 18px;border-radius:14px;font-weight:700;font-size:13px;animation:scaleIn .25s;
}

h1{margin:0 0 14px;font-size:22px;font-weight:800}
h2{margin:22px 0 10px;font-size:16px;font-weight:700}
.muted{opacity:.7;font-weight:500;font-size:13px}
#lb,#h{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:4px 2px 10px 0}
.list>*{flex:none}

@media(max-width:820px){
  .game{grid-template-columns:1fr;gap:10px}
  .pad{grid-template-columns:repeat(9,1fr);max-width:none;gap:5px;margin:8px 0}
  .pad button{aspect-ratio:.85;font-size:17px;padding:0;box-shadow:2px 2px 0 var(--border)}
  .board{width:min(100%,calc(100dvh - 285px))}
  .page.play-pg .board{width:min(100%,calc(100dvh - 260px))}
  .bar{margin-bottom:6px}
  .tools button{font-size:11px;padding:9px 2px}
}
@media(max-width:620px){
  .menu{gap:10px}.mc{padding:14px}.mc b{font-size:15px}.mc small{font-size:11px}
  .mc .ci{width:42px;height:42px;font-size:20px}
  .row-l{grid-template-columns:32px 32px 1fr 60px}.sm2{display:none}
  .hist{grid-template-columns:1fr 1fr 1fr}.hist span:nth-child(4){display:none}
  .banner{padding:22px 16px 18px}
}
@media(max-height:700px){
  .banner p,.mc small{display:none}
  .page.play-pg .board{width:min(100%,calc(100dvh - 235px))}
}
@media(max-width:820px) and (max-height:700px){
  .page.play-pg .board{width:min(100%,calc(100dvh - 230px))}
}

const FB={apiKey:"AIzaSyBN4hV5gY9Q3Py3wKAWZECNwHphzVbgHsA",authDomain:"sudoku-65c6e.firebaseapp.com",databaseURL:"https://sudoku-65c6e-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sudoku-65c6e",appId:"1:641987606390:web:d0626e9963cb20b6f0ec57"};

const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LV={easy:'Dễ',medium:'Trung bình',hard:'Khó',expert:'Chuyên gia'},LK=Object.keys(LV);

const READY=!!FB.apiKey;let db,auth,me=null,pending=null;
if(READY){firebase.initializeApp(FB);auth=firebase.auth();db=firebase.database()}
const defSt=()=>({games:0,wins:0,points:0,streak:0,maxStreak:0,lastWin:'',noMistake:0,best:{}});

function pick(g){let best=-1,bm=0,bc=10;for(let i=0;i<81;i++)if(!g[i]){const r=(i/9)|0,c=i%9;let u=0;
  for(let k=0;k<9;k++){u|=1<<g[r*9+k];u|=1<<g[k*9+c]}const br=r-r%3,cc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)u|=1<<g[(br+a)*9+cc+b];
  const m=~u&0x3fe;let n=0,x=m;while(x){n++;x&=x-1}if(n<bc){bc=n;best=i;bm=m;if(n<=1)break}}return[best,bm,bc]}
function fill(g){const[i,m]=pick(g);if(i<0)return true;const ds=[];for(let d=1;d<=9;d++)if(m&(1<<d))ds.push(d);for(const d of shuffle(ds)){g[i]=d;if(fill(g))return true}g[i]=0;return false}
function count(g,lim){const[i,m,c]=pick(g);if(i<0)return 1;if(c===0)return 0;let n=0;for(let d=1;d<=9;d++)if(m&(1<<d)){g[i]=d;n+=count(g,lim-n);g[i]=0;if(n>=lim)break}return n}
function generate(diff){const sol=Array(81).fill(0);fill(sol);const p=sol.slice();let left=81;
  for(const i of shuffle([...Array(81).keys()])){if(left<=CLUES[diff])break;const v=p[i];p[i]=0;if(count(p,2)!==1)p[i]=v;else left--}
  return{puzzle:p.join(''),sol:sol.join('')}}

/* ===== Chơi ===== */
const peers=(a,b)=>{const ra=a/9|0,ca=a%9,rb=b/9|0,cb=b%9;return ra===rb||ca===cb||((ra/3|0)===(rb/3|0)&&(ca/3|0)===(cb/3|0))};
function play(el,diff0){let g=null,alive=true;const KEY='sd_game';
  el.classList.add('play-pg');
  el.innerHTML=`<div class="game"><div><div class="bar"><span class="pill y">🎯 ${LV[diff0]}</span><div class="stats"><span>⏱ <b id="tm">00:00</b></span><span>❌ <b id="ms">0</b></span><span>💡 <b id="hs">0</b></span></div></div><div class="board" id="bd"></div></div>
  <div><div class="tools"><button id="un">↩ Hoàn tác</button><button id="er">⌫ Xóa</button><button id="nt">✏️ Ghi chú</button><button id="hi">💡 Gợi ý</button></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
  <div class="acts"><button class="btn ghost" id="rs">🔁 Chơi lại</button><button class="btn" id="nw">✨ Ván mới</button><a class="btn ghost" href="#/play">🎚 Đổi chế độ</a></div>
  <p class="muted">Phím tắt: 1–9 nhập · Backspace xóa · N ghi chú · Ctrl+Z hoàn tác · ←↑↓→ di chuyển</p>${me?'':'<p class="muted">💡 Đăng nhập trước khi chơi để điểm được lưu vào bảng xếp hạng.</p>'}</div></div>`;
  const save=()=>g&&!g.done&&localStorage.setItem(KEY,JSON.stringify({...g,notes:g.notes.map(s=>[...s]),undo:[],user:me?.uid||null}));
  function mk(d,sv){g=sv?{...sv,notes:sv.notes.map(a=>new Set(a)),sel:-1,note:false,undo:[],done:false}:{puzzle:d.puzzle,sol:d.sol,diff:d.diff,vals:[...d.puzzle].map(Number),notes:Array.from({length:81},()=>new Set()),start:Date.now(),mistakes:0,hints:0,sel:-1,note:false,undo:[],done:false};draw();save()}
  const start=(diff,same)=>{const d=same?{puzzle:g.puzzle,sol:g.sol,diff:g.diff}:{...generate(diff),diff};mk(d)};
  const okc=i=>g.vals[i]&&g.vals[i]===+g.sol[i];
  function draw(){if(!alive||!g)return;const s=g.sel,sv=s>=0?g.vals[s]:0;
    $('#bd',el).innerHTML=g.vals.map((v,i)=>{const r=i/9|0,c=i%9,cl=['c'];if(c%3===2&&c<8)cl.push('br');if(r%3===2&&r<8)cl.push('bb');
      if(g.puzzle[i]!=='0')cl.push('fx');else if(v&&!okc(i)&&S.errors)cl.push('bad');else if(v)cl.push('usr');
      if(s>=0){if(i===s)cl.push('sel');else{if(peers(s,i))cl.push('pr');if(S.same&&sv&&v===sv)cl.push('sm')}}
      return `<div class="${cl.join(' ')}" data-i="${i}">${v?v:g.notes[i].size?`<div class="nt">${[1,2,3,4,5,6,7,8,9].map(n=>`<i>${g.notes[i].has(n)?n:''}</i>`).join('')}</div>`:''}</div>`}).join('');
    $('#ms',el).textContent=g.mistakes;$('#hs',el).textContent=g.hints;$('#nt',el).classList.toggle('on',g.note)}
  const snap=i=>g.undo.push({i,val:g.vals[i],notes:[...g.notes[i]]});
  function put(v){if(!g||g.done)return;const i=g.sel;if(i<0)return toast('Chọn một ô trước');if(g.puzzle[i]!=='0'||okc(i))return;
    if(g.note){if(g.vals[i])return;snap(i);g.notes[i].has(v)?g.notes[i].delete(v):g.notes[i].add(v);draw();save();return}
    if(g.vals[i]===v)return;snap(i);g.vals[i]=v;g.notes[i].clear();
    if(v!==+g.sol[i])g.mistakes++;else g.notes.forEach((s,j)=>{if(j!==i&&peers(i,j))s.delete(v)});
    draw();save();check()}
  function erase(){if(!g||g.done||g.sel<0)return;const i=g.sel;if(g.puzzle[i]!=='0'||okc(i)||(!g.vals[i]&&!g.notes[i].size))return;snap(i);g.vals[i]=0;g.notes[i].clear();draw();save()}
  function undo(){const u=g&&g.undo.pop();if(!u)return toast('Không còn gì để hoàn tác');g.vals[u.i]=u.val;g.notes[u.i]=new Set(u.notes);g.sel=u.i;draw();save()}
  function hint(){if(!g||g.done)return;const i=g.sel;if(i<0||g.puzzle[i]!=='0'||okc(i))return toast('Chọn một ô trống để nhận gợi ý (−150 điểm)');
    g.vals[i]=+g.sol[i];g.notes[i].clear();g.hints++;g.undo=[];g.notes.forEach((s,j)=>{if(peers(i,j))s.delete(g.vals[i])});draw();save();check()}
  const check=()=>{if(g.vals.every((v,i)=>v===+g.sol[i]))win()};
  async function win(){g.done=true;localStorage.removeItem(KEY);const sec=Math.max(1,Math.round((Date.now()-g.start)/1000)),empty=[...g.puzzle].filter(c=>c==='0').length;
    const base=BASE[g.diff],bt=Math.round(base*.5*Math.max(0,1-sec/PAR[g.diff]));let pts=Math.max(100,base+bt-g.hints*150-g.mistakes*100),streak=0,msg='Đăng nhập trước khi chơi để lưu điểm.';
    if(me&&READY){if(sec<empty*0.8){pts=0;msg='Thời gian nhanh bất thường — điểm không được ghi nhận.'}else{
      try{const st=me.stats,t=vnDay();st.streak=st.lastWin===t?Math.max(1,st.streak):st.lastWin===addDays(t,-1)?st.streak+1:1;st.lastWin=t;streak=st.streak;
        pts+=Math.min(st.streak-1,7)*100;st.games++;st.wins++;st.points+=pts;st.maxStreak=Math.max(st.maxStreak,st.streak);if(!g.mistakes)st.noMistake++;st.best[g.diff]=st.best[g.diff]?Math.min(st.best[g.diff],sec):sec;
        const lvl=LK.indexOf(g.diff),P=pts;await db.ref('users/'+me.uid+'/stats').set(st);
        await db.ref('games/'+me.uid).push({diff:g.diff,seconds:sec,mistakes:g.mistakes,hints:g.hints,points:P,at:Date.now()});
        for(const[p,k]of Object.entries(keys()))await db.ref(`scores/${p}/${k}/${me.uid}`).transaction(e=>{e=e||{points:0,wins:0,lvl:-1,best:0};e.points+=P;e.wins++;e.name=me.name;e.avatar=me.avatar;
          if(lvl>e.lvl){e.lvl=lvl;e.best=sec}else if(lvl===e.lvl)e.best=Math.min(e.best,sec);return e});msg='Điểm đã được lưu vào bảng xếp hạng.'}catch(e){msg='Không lưu được điểm: '+e.message}}}
    if(!alive)return;$('#tm',el).textContent=fmt(sec);const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<div class="card pop"><h2>🎉 Hoàn thành!</h2><p>${LV[g.diff]} · ${fmt(sec)}</p><div class="kv"><span>Lỗi</span><b>${g.mistakes}</b><span>Gợi ý</span><b>${g.hints}</b><span>Điểm</span><b>+${pts}</b>${streak?`<span>Chuỗi ngày</span><b>🔥 ${streak}</b>`:''}</div><p class="muted">${msg}</p><div class="row"><button class="btn" id="m1">Ván mới</button><a class="btn ghost" href="#/play">Đổi chế độ</a><a class="btn ghost" href="#/leaderboard">Xếp hạng</a></div></div>`;
    el.append(m);$('#m1',m).onclick=()=>{m.remove();start(g.diff)}}
  async function askLeave(msg){if(g.done||!g.vals.some((v,i)=>g.puzzle[i]==='0'&&v))return true;return confirmModal('Bỏ ván hiện tại?',msg||'Bạn sẽ mất tiến độ của ván đang chơi.','Bỏ ván','Ở lại')}
  $('#bd',el).onclick=e=>{const c=e.target.closest('.c');if(c&&g){g.sel=+c.dataset.i;draw()}};
  el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>put(+b.dataset.n));
  
  $('#un',el).onclick=undo;$('#er',el).onclick=erase;$('#hi',el).onclick=hint;$('#nt',el).onclick=()=>{g.note=!g.note;draw()};
  $('#rs',el).onclick=async()=>{if(await askLeave('Chơi lại từ đầu với cùng đề bài?'))start(g.diff,true)};
  $('#nw',el).onclick=async()=>{if(await askLeave('Bắt đầu ván mới (đề khác)?'))start(g.diff)};
  const key=e=>{if(!g||g.done||e.target.matches('input'))return;
    if(/^[1-9]$/.test(e.key))put(+e.key);else if(['Backspace','Delete','0'].includes(e.key))erase();
    else if(e.key.toLowerCase()==='n'&&!e.ctrlKey){g.note=!g.note;draw()}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
    else if(e.key.startsWith('Arrow')){e.preventDefault();const d={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key],n=(g.sel<0?40:g.sel)+d;if(n>=0&&n<81&&!(d===1&&n%9===0)&&!(d===-1&&n%9===8)){g.sel=n;draw()}}};
  document.addEventListener('keydown',key);const tm=setInterval(()=>{if(g&&!g.done)$('#tm',el).textContent=fmt((Date.now()-g.start)/1000)},500);
  let sv=null;try{sv=JSON.parse(localStorage.getItem(KEY))}catch{}
  setTimeout(()=>{if(sv&&sv.user===(me?.uid||null)&&sv.diff===diff0)mk(null,sv);else start(diff0)},30);
  return()=>{alive=false;clearInterval(tm);document.removeEventListener('keydown',key)}}

/* ===== Hồ sơ / Lịch sử / Cài đặt ===== */
function profile(el){const s=me.stats;let av=me.avatar;
  const ach=[['🏁','Ván thắng đầu tiên',s.wins>=1],['🔟','10 ván thắng',s.wins>=10],['💯','50 ván thắng',s.wins>=50],['🎯','Thắng không lỗi',s.noMistake>=1],['🔥','Chuỗi 7 ngày',s.maxStreak>=7],['🧠','Thắng Chuyên gia',!!s.best.expert],['⚡','Thắng Dễ < 3 phút',s.best.easy>0&&s.best.easy<180]];
  el.innerHTML=`<div class="card prof"><span class="av big">${esc(me.avatar)}</span><div><h1>${esc(me.name)}</h1><span class="muted">@${esc(me.email.split('@')[0])}</span></div></div>
  <div class="grid4">${[['Tổng điểm',s.points],['Ván thắng',s.wins],['Chuỗi ngày 🔥',s.streak],['Chuỗi dài nhất',s.maxStreak]].map(([k,v])=>`<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div>
  <h2>Kỷ lục thời gian</h2><div class="grid4">${LK.map(k=>`<div class="card stat"><b>${s.best[k]?fmt(s.best[k]):'--:--'}</b><span>${LV[k]}</span></div>`).join('')}</div>
  <h2>Thành tích</h2><div class="ach">${ach.map(([i,n,o])=>`<div class="${o?'':'off'}">${i} ${n}</div>`).join('')}</div>
  <h2>Chỉnh sửa hồ sơ</h2><div class="card"><input id="nm" class="inp" maxlength="20" value="${esc(me.name)}"><div class="chips" id="avs">${AV.map(a=>`<button data-a="${a}" class="${a===av?'on':''}">${a}</button>`).join('')}</div><p><button class="btn" id="sv">Lưu</button> <button class="btn ghost" id="lo">Đăng xuất</button></p></div>`;
  $('#avs',el).onclick=e=>{if(e.target.dataset.a){av=e.target.dataset.a;el.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('on',b.dataset.a===av))}};
  $('#sv',el).onclick=async()=>{const name=$('#nm',el).value.trim();if(name.length<2)return toast('Tên 2–20 ký tự');try{await db.ref('profiles/'+me.uid).set({name,avatar:av});me.name=name;me.avatar=av;renderUser();toast('Đã lưu hồ sơ');route()}catch(e){toast(e.message)}};
  $('#lo',el).onclick=async()=>{await auth.signOut();localStorage.removeItem('sd_game');location.hash='#/'}}
async function history(el){el.innerHTML='<h1>🕘 Lịch sử chơi</h1><div id="h" class="list"></div>';
  try{const h=Object.values((await db.ref('games/'+me.uid).once('value')).val()||{}).sort((a,b)=>b.at-a.at).slice(0,100);
    $('#h',el).innerHTML=h.length?h.map(g=>`<div class="row-l hist"><span>${new Date(g.at).toLocaleString('vi-VN')}</span><span>${LV[g.diff]}</span><span>${fmt(g.seconds)}</span><span>${g.mistakes} lỗi · ${g.hints} gợi ý</span><b class="pt">+${g.points}</b></div>`).join(''):'<p class="muted">Bạn chưa hoàn thành ván nào.</p>'}catch(e){toast(e.message)}}
function settings(el){const T=[['dark','🌙 Chế độ tối'],['errors','Hiển thị số sai màu đỏ'],['same','Làm nổi bật các số trùng nhau']];
  el.innerHTML=`<h1>⚙️ Cài đặt</h1><div class="card">${T.map(([k,v])=>`<label class="sw"><span>${v}</span><input type="checkbox" data-k="${k}" ${S[k]?'checked':''}></label>`).join('')}</div>${me?'<p><a class="btn ghost" href="#/profile">Chỉnh sửa hồ sơ</a></p>':''}`;
  el.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{S[i.dataset.k]=i.checked;applyTheme()})}

/* ===== Điều hướng ===== */
const T={'/play':'Chọn chế độ','/leaderboard':'Bảng xếp hạng','/profile':'Hồ sơ','/history':'Lịch sử chơi','/settings':'Cài đặt','/login':'Tài khoản'};const R={'/':home,'/play':modes,'/leaderboard':board,'/profile':profile,'/history':history,'/settings':settings,'/login':login};let cleanup;
async function route(){cleanup&&cleanup();cleanup=null;const p0=location.hash.slice(1)||'/',gm=p0.match(/^\/play\/(easy|medium|hard|expert)$/),p=gm?'/play/':p0;
  if(['/profile','/history'].includes(p)&&!me){location.hash='#/login';return}
  document.body.classList.toggle('home',p==='/');$('#pt').textContent=gm?'Chơi · '+LV[gm[1]]:T[p]||'Sudoku';$('#bk').href=gm?'#/play':'#/';
  const el=$('#app');el.className='page';el.innerHTML='';const c=await(gm?e=>play(e,gm[1]):R[p]||home)(el);if(typeof c==='function')cleanup=c;scrollTo(0,0)}
(()=>{const b=document.createElement('div');b.className='bgd';document.body.append(b)})();
applyTheme();addEventListener('hashchange',route);
if(READY)auth.onAuthStateChanged(async u=>{try{await loadMe(u)}catch(e){me=null;toast(e.message)}renderUser();route()});else{renderUser();route()}
</script></body></html>
